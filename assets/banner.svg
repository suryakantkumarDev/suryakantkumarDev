<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Suryakant Kumar — Full-Stack Software Engineer</title>
<desc id="desc">Web, mobile and applied AI. A midnight-blue banner with subtly animated engineering connections.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#080e1b"/></linearGradient><linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#818cf8"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#27354b" stroke-width=".5"/></pattern></defs>
<style>@keyframes flow{to{stroke-dashoffset:-160}}@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}.flow{stroke-dasharray:8 72;animation:flow 8s linear infinite}.pulse{animation:breathe 6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
<rect width="1000" height="300" rx="20" fill="url(#bg)"/><rect x="620" width="380" height="300" rx="20" fill="url(#grid)" opacity=".6"/>
<rect x="1" y="1" width="998" height="298" rx="19" fill="none" stroke="#29364d"/>
<path d="M48 48H102" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="48" y="82" font-size="12" letter-spacing="3" fill="#5eead4">ENGINEERING ACROSS THE STACK</text><text x="45" y="143" font-size="49" font-weight="700" letter-spacing="-2" fill="#f1f5f9">Suryakant Kumar<tspan fill="#5eead4">.</tspan></text><text x="48" y="181" font-size="22" fill="#cbd5e1">Full-Stack Software Engineer</text><text x="48" y="222" font-size="15" fill="#94a3b8">WEB APPLICATIONS / MOBILE / APPLIED AI</text><text x="48" y="268" font-size="12" letter-spacing="1" fill="#64748b">HYDERABAD, INDIA</text></g>
<g fill="none" stroke="#334155" stroke-width="1.5"><path d="M700 85H810V150H915"/><path d="M700 215H810V150"/><circle cx="810" cy="150" r="68"/><circle cx="810" cy="150" r="98" stroke-dasharray="3 9"/></g>
<g fill="none" stroke="url(#accent)" stroke-width="2.5" class="flow"><path d="M700 85H810V150H915"/><path d="M700 215H810V150"/></g>
<circle cx="810" cy="150" r="49" fill="#111f33" stroke="#456079"/><text x="810" y="162" text-anchor="middle" font-family="monospace" font-weight="700" font-size="35" fill="#5eead4">&lt;/&gt;</text>
<g fill="#0f1c2e" stroke="#52647c"><rect x="658" y="67" width="85" height="36" rx="9"/><rect x="658" y="197" width="85" height="36" rx="9"/><rect x="880" y="132" width="78" height="36" rx="9"/></g>
<g fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1" text-anchor="middle"><text x="700" y="90">WEB</text><text x="700" y="220">MOBILE</text><text x="919" y="155">AI</text></g><circle class="pulse" cx="810" cy="52" r="4" fill="#818cf8"/><circle class="pulse" cx="810" cy="248" r="4" fill="#5eead4"/>
</svg>
